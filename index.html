<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Daily Inspiration</title>

<style>
* {
box-sizing: border-box;
}

html, body {
margin: 0;
padding: 0;
background: #EAF2F8;
}

body {
font-family: Georgia, serif;
}

#inspiration {
background: #EAF2F8;
color: #243B53;
text-align: center;
padding: 25px 30px;
min-height: 170px;
display: flex;
flex-direction: column;
justify-content: center;
}

.label {
font-family: Arial, sans-serif;
font-size: 11px;
letter-spacing: 3px;
font-weight: bold;
margin-bottom: 18px;
}

#quote {
font-size: 19px;
line-height: 1.5;
}

#source {
font-family: Arial, sans-serif;
font-size: 11px;
margin-top: 15px;
opacity: 0.75;
}

</style>
</head>

<body>

<div id="inspiration">
<div class="label">✦ DAILY INSPIRATION</div>
<div id="quote"></div>
<div id="source"></div>
</div>

<script>

{

{

{

},

{

},

{
text: "Make things easy and do not make things difficult.",
source: "Sahih al-Bukhari · 69"
},

{
text: "It always seems impossible until it is done.",
source: "Common motivational saying"
},

{
text: "And He found you lost and guided you.",

},

{
text: "None of you truly believes until he loves for his brother what he loves for himself.",

{

function showDailyQuote() {

const now = new Date();

const startOfYear = new Date(
now.getFullYear(),
0,
1
);

const dayNumber = Math.floor(
(now - startOfYear) / 86400000
);

const selected = quotes[dayNumber % quotes.length];

document.getElementById("quote").textContent =
"“" + selected.text + "”";

document.getElementById("source").textContent =
selected.source;

}

showDailyQuote();

</script>

</body>
</html>
